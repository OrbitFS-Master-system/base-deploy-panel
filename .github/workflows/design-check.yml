name: Dev Panel build check

on:
  push:
    branches:
      - main
      - design/orbitfs-control-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
