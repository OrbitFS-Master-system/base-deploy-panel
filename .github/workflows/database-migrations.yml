name: Dev Panel database migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-panel-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::SUPABASE_DB_URL GitHub secret is not configured"; exit 1; }
          test -d supabase/migrations || { echo "::error::supabase/migrations directory is missing"; exit 1; }
          echo "Migration files:"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort

      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"
